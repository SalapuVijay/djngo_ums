<!DOCTYPE html>
<html>

<head>
    <title>Logged Out - UMS</title>
    <style>
        body {
            background: linear-gradient(135deg, #141e30, #243b55);
            font-family: 'Segoe UI', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 400px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #00f5d4;
            color: black;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #00c2a8;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>You have been logged out successfully.</h2>
        <p>Thank you for using UMS.</p>
        <a href="/login/">Login Again</a>
    </div>

</body>

</html>
