<!DOCTYPE html>
<html>
<head>
    <title>Register - UMS</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #0f0f0f;
            padding: 60px 0;
            color: white;
        }

        .container {
            display: flex;
            justify-content: center;
        }

        .box {
            background: #1f2937;
            padding: 40px;
            width: 420px;
            border-radius: 12px;
            border-top: 5px solid #ff6f00;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
            color: #90ee90;
            margin-bottom: 25px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #555;
            background: #0f0f0f;
            color: white;
        }

        input:focus, select:focus {
            border-color: #90ee90;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ff6f00;
            border: none;
            border-radius: 6px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }

        button:hover {
            background: #f4c430;
            color: black;
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
        }

        .login-link a {
            text-decoration: none;
            color: #90ee90;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="box">
        <h2>Create Account</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>

        <div class="login-link">
            <a href="{% url 'login' %}">Already have an account? Login</a>
        </div>
    </div>
</div>

</body>
</html>
