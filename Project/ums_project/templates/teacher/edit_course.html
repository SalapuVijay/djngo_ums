{% extends 'base.html' %}

{% block content %}

<div class="card">
    <h2>Edit Course</h2>
    
    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags | default:'success' }}">
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="name">Course Name:</label>
            <input type="text" id="name" name="name" value="{{ course.name }}" placeholder="e.g., Introduction to Python" required>
        </div>

        <div class="form-group">
            <label for="semester">Semester:</label>
            <select id="semester" name="semester" required>
                <option value="">-- Select Semester --</option>
                <option value="1" {% if course.semester == 1 %}selected{% endif %}>Semester 1</option>
                <option value="2" {% if course.semester == 2 %}selected{% endif %}>Semester 2</option>
                <option value="3" {% if course.semester == 3 %}selected{% endif %}>Semester 3</option>
                <option value="4" {% if course.semester == 4 %}selected{% endif %}>Semester 4</option>
                <option value="5" {% if course.semester == 5 %}selected{% endif %}>Semester 5</option>
                <option value="6" {% if course.semester == 6 %}selected{% endif %}>Semester 6</option>
                <option value="7" {% if course.semester == 7 %}selected{% endif %}>Semester 7</option>
                <option value="8" {% if course.semester == 8 %}selected{% endif %}>Semester 8</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Update Course</button>
    </form>

    <p><a href="{% url 'manage_courses' %}">Back to Courses</a></p>
</div>

{% endblock %}
