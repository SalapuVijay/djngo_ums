{% extends 'base.html' %}

{% block content %}

<div class="card">
    <h2>Upload CGPA</h2>
    <form method="POST">
        {% csrf_token %}

        <label>Student:</label>
        <select name="student">
            {% for s in students %}
            <option value="{{ s.id }}">{{ s.username }}</option>
            {% endfor %}
        </select>

        <label>CGPA:</label>
        <input type="number" step="0.01" name="cgpa">

        <button type="submit">Upload</button>
    </form>
</div>

{% endblock %}
